#------------------------------------------------------------
# BTP Destination: UAS_Reporting_Destination
# Used by: SAP Integration Suite API Artifact (Integration Cell)
# Guide:   https://community.sap.com/...
#
# HOW TO IMPORT:
#   BTP Cockpit → Subaccount → Connectivity → Destinations
#   → Import Destination → select this file
#
# Replace all <PLACEHOLDER> values before importing.
#------------------------------------------------------------

Name=UAS_Reporting_Destination
Type=HTTP
URL=https://uas-reporting.cfapps.eu10.hana.ondemand.com
ProxyType=Internet
Authentication=OAuth2ClientCredentials

# OAuth 2.0 credentials for the UAS Reporting backend
# Obtain from your BTP subaccount → Instances and Subscriptions
# → SAP Usage Data Management service → Service Key
clientId=<CLIENT_ID>
clientSecret=<CLIENT_SECRET>
tokenServiceURL=https://<IDENTITY_ZONE>.authentication.eu10.hana.ondemand.com/oauth/token
tokenServiceURLType=Dedicated

# Required label so the Destination appears in Integration Cell target selection
# Add this under Destination → Labels (NOT Additional Properties)
# Key:   IntegrationCell.Include
# Value: true
